name: Build Safe Translator APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.py'
      - 'buildozer.spec'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-venv git zip unzip \
            openjdk-17-jdk build-essential autoconf automake \
            libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer and dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "git+https://github.com/kivy/buildozer" \
            legacy-cgi \
            "cython==0.29.34"

      - name: Show build configuration
        run: |
          . .venv/bin/activate
          buildozer --version
          grep -E '^(android.ndk|android.ndk_api|android.archs|p4a.branch|p4a.commit|requirements) *=' buildozer.spec

      - name: Build debug APK
        run: |
          . .venv/bin/activate
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Safe-Translator-Android-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
