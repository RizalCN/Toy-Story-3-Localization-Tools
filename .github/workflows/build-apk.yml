name: Build Safe Translator APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.py'
      - '**.txt'
      - 'buildozer.spec'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-venv \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Configure Java 17
        shell: bash
        run: |
          JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

          if [ ! -x "$JAVA_HOME/bin/java" ]; then
            echo "Java 17 tidak ditemukan: $JAVA_HOME"
            exit 1
          fi

          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

          sudo update-alternatives --set java "$JAVA_HOME/bin/java"

          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Setup Python environment
        run: |
          python3 -m venv .venv

          .venv/bin/python -m pip install --upgrade \
            pip setuptools wheel

          .venv/bin/python -m pip install \
            "git+https://github.com/kivy/buildozer" \
            "cython==0.29.34" \
            legacy-cgi

      - name: Verify tools
        shell: bash
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PWD/.venv/bin:$PATH"

          echo "===== JAVA ====="
          java -version

          echo "===== PYTHON ====="
          python --version

          echo "===== CYTHON ====="
          command -v cython
          cython --version

          echo "===== BUILDOZER ====="
          buildozer --version

      - name: Build debug APK
        shell: bash
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PWD/.venv/bin:$PATH"

          set -o pipefail

          java -version
          cython --version

          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Safe-Translator-Android-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
